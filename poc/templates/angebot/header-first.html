<!-- Header nur für Seite 1. Grafiken (Streifen, Logo, Icons, Infobox-Fläche) kommen aus dem @page-Hintergrund,
     hier steht nur Text (live, markierbar, per Shortcode befüllt). Layout per Tabelle: mPDF-sicher.
     Formatierung liegt auf den td-Zellen (Padding/Ausrichtung auf div in Header-Tabellen greift in mPDF nicht zuverlässig). -->
<table class="hf"><tr>
  <td rowspan="2" style="width:117.2mm" class="adr">[bw_each source="kunde.adresse_zeilen"][bw_var key="zeile"]<br />[/bw_each]</td>
  <td class="kontakt">[bw_var key="firma.telefon"]<br />[bw_var key="firma.mail"]<br />[bw_var key="firma.web"]</td>
</tr><tr>
  <td class="info">Kunde: [bw_var key="kunde.kuerzel"]<br />Nr. [bw_var key="dokument.nummer"]<br />Datum: [bw_var key="dokument.datum" format="date"]</td>
</tr></table>
